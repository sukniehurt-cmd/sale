<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nie znaleziono strony — Pralnia AF</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 2rem 1.5rem; text-align: center;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #1e293b; background: linear-gradient(160deg, #2a5b84 0%, #5b8cba 100%);
  }
  .karta {
    background: #fff; border-radius: 1.75rem; padding: 3rem 2rem;
    max-width: 34rem; width: 100%; box-shadow: 0 25px 50px rgba(15,42,68,.25);
  }
  .kod { font-size: 4rem; font-weight: 700; color: #2a5b84; margin: 0 0 .5rem; letter-spacing: -.02em; }
  h1 { font-size: 1.5rem; margin: 0 0 1rem; }
  p { color: #475569; margin: 0 0 1.5rem; }
  .przyciski { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
  a.btn {
    display: inline-block; padding: .85rem 1.75rem; border-radius: 999px;
    text-decoration: none; font-weight: 600; transition: opacity .2s;
  }
  a.btn:hover { opacity: .88; }
  .glowny { background: #2a5b84; color: #fff; }
  .drugi { background: #eef5fb; color: #2a5b84; }
</style>
</head>
<body>
  <div class="karta">
    <p class="kod">404</p>
    <h1>Tej strony u nas nie ma</h1>
    <p>Adres jest nieaktualny albo zawiera literówkę. Wróć na stronę główną
       lub po prostu do nas zadzwoń — chętnie pomożemy.</p>
    <div class="przyciski">
      <a class="btn glowny" href="/">Strona główna</a>
      <a class="btn drugi" href="tel:+48536212505">Zadzwoń: 536 212 505</a>
    </div>
  </div>
</body>
</html>
